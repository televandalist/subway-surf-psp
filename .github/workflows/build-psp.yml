
name: Build Subway Surfers PSP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compile using PSPDEV
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            pspdev/pspdev:latest \
            sh -c 'make -j2'

      - name: Verify EBOOT
        run: test -f EBOOT.PBP

      - name: Upload PSP build
        uses: actions/upload-artifact@v4
        with:
          name: Subway-Surfers-PSP
          path: EBOOT.PBP
          if-no-files-found: error
